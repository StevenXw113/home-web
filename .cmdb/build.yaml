# .cmdb/build.yaml —— 平台按探测结果生成，合并即生效。
#
# 这是「研发拥有的那一半」配置（设计文档 §9.1）：构建怎么做由你决定。副本数、内存上限、
# 探针参数不在这里，写进来也不会生效——那一半属于 SRE 维护的 Deployment Profile，
# 要改走平台界面。
#
# 平台探测时的取舍：静态站点没有进程：K8s 下由 nginx 托管，主机部署放到 nginx root，也可发到对象存储 + CDN（无探针、无端口）
version: "1"
app: home-web

build:
  # language 写死而不是每次重新探测：依赖变化会让探测结论跟着变，而「构建计划跟着依赖变」
  # 是没人预料到的。写在这里之后，探测只在接入时参与一次（impl/01 §2.1 第 1 条）。
  language: static
  toolVersion: "20"
  # steps 留空 = 用平台按 static 给的默认计划：deps · lint · test · build。
  # 要自定义就把每一步都写出来——平台不会把你的 steps 与默认计划合并，写一半只会跑那一半。
  steps: []
  artifact:
    type: image
    # 仓库里已经有 Dockerfile，平台不会覆盖它。留空表示由平台按语言模板渲染一份用于构建；
    # 要用仓库里那一份，把路径填在下面。
    dockerfile: "Dockerfile"
